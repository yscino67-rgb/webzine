backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "게시글"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - label: "제목"
        name: "title"
        widget: "string"

      - label: "작성자"
        name: "author"
        widget: "string"

      - label: "작성일"
        name: "date"
        widget: "datetime"

      - label: "본문"
        name: "body"
        widget: "markdown"