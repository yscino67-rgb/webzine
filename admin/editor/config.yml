backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "게시글"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"

    fields:
      - label: "제목"
        name: "title"
        widget: "string"

      - label: "작성자"
        name: "author"
        widget: "string"

      - label: "작성일"
        name: "date"
        widget: "datetime"

      - label: "카테고리"
        name: "category"
        widget: "select"
        options:
          - "Article"
          - "Criticism"
          - "Essay"
          - "Interview"

      - label: "대표 이미지"
        name: "thumbnail"
        widget: "image"
        required: false

      - label: "본문"
        name: "body"
        widget: "markdown"