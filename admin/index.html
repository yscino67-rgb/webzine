<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#ffffff"
    />

    <title>횡단 CMS</title>

    <link
      rel="stylesheet"
      href="./admin.css?v=3"
    />
  </head>

  <body>
    <!-- ===================================================
         로그인
    ==================================================== -->

    <main
      class="admin-login"
      id="login-view"
    >
      <form
        class="login-panel"
        id="login-form"
      >
        <p class="admin-eyebrow">
          HWENGDAN CMS
        </p>

        <h1>관리자 로그인</h1>

        <label for="admin-password">
          비밀번호
        </label>

        <input
          id="admin-password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />

        <button type="submit">
          로그인
        </button>

        <p
          class="form-message"
          id="login-message"
          aria-live="polite"
        ></p>
      </form>
    </main>

    <!-- ===================================================
         CMS
    ==================================================== -->

    <main
      class="admin-app"
      id="admin-view"
      hidden
    >
      <header class="admin-header">
        <a
          class="admin-brand"
          href="/"
          target="_blank"
          rel="noopener"
        >
          횡단 CMS
        </a>

        <div class="admin-header-actions">
          <a
            href="/html/archive.html"
            target="_blank"
            rel="noopener"
          >
            사이트 보기
          </a>

          <button
            type="button"
            id="logout-button"
          >
            로그아웃
          </button>
        </div>
      </header>

      <div class="admin-layout">
        <!-- 게시글 목록 -->

        <aside class="post-sidebar">
          <div class="sidebar-header">
            <h2>게시글</h2>

            <button
              type="button"
              id="new-post-button"
            >
              새 글
            </button>
          </div>

          <div
            class="post-list"
            id="post-list"
          ></div>
        </aside>

        <!-- 게시글 편집 -->

        <section class="post-editor">
          <form id="post-form">
            <input
              type="hidden"
              id="post-id"
            />

            <!-- 업로드된 실제 이미지 경로 -->
            <input
              type="hidden"
              id="post-thumbnail"
            />

            <div class="editor-heading">
              <div>
                <p class="admin-eyebrow">
                  POST EDITOR
                </p>

                <h1 id="editor-title">
                  새 게시글
                </h1>
              </div>

              <div class="editor-actions">
                <button
                  class="delete-button"
                  type="button"
                  id="delete-post-button"
                  hidden
                >
                  삭제
                </button>

                <button
                  class="save-button"
                  type="submit"
                >
                  저장
                </button>
              </div>
            </div>

            <!-- =================================================
                 기본 정보
            ================================================== -->

            <div class="field-grid">
              <label class="field field--wide">
                <span>제목</span>

                <input
                  type="text"
                  id="post-title"
                  required
                />
              </label>

              <label class="field">
                <span>작성자</span>

                <input
                  type="text"
                  id="post-author"
                  required
                />
              </label>

              <label class="field">
                <span>작성일</span>

                <input
                  type="date"
                  id="post-date"
                  required
                />
              </label>

              <label class="field">
                <span>카테고리</span>

                <select id="post-category">
                  <option value="criticism">
                    CRITICISM
                  </option>

                  <option value="interview">
                    INTERVIEW
                  </option>

                  <option value="essay">
                    ESSAY
                  </option>

                  <option value="article">
                    ARTICLE
                  </option>
                </select>
              </label>

              <label class="field">
                <span>세부 카테고리</span>

                <input
                  type="text"
                  id="post-subcategory"
                  placeholder="CRITICISM"
                />
              </label>

              <!-- =================================================
                   대표 이미지 파일
              ================================================== -->

              <div class="field field--wide">
                <span>대표 이미지</span>

                <div class="image-upload-row">
                  <input
                    type="file"
                    id="post-thumbnail-file"
                    accept="image/jpeg,image/png,image/webp,image/gif"
                  />

                  <button
                    type="button"
                    class="image-upload-button"
                    id="image-upload-button"
                  >
                    이미지 업로드
                  </button>
                </div>

                <p
                  class="image-upload-status"
                  id="image-upload-status"
                  aria-live="polite"
                ></p>

                <div
                  class="image-upload-preview-wrap"
                  id="image-upload-preview-wrap"
                  hidden
                >
                  <img
                    id="image-upload-preview"
                    class="image-upload-preview"
                    alt="대표 이미지 미리보기"
                  />

                  <button
                    type="button"
                    class="image-remove-button"
                    id="image-remove-button"
                  >
                    이미지 제거
                  </button>
                </div>
              </div>

              <label class="field">
                <span>이미지 설명</span>

                <input
                  type="text"
                  id="post-image-caption"
                />
              </label>

              <label class="field">
                <span>이미지 출처</span>

                <input
                  type="text"
                  id="post-image-source"
                />
              </label>

              <!-- =================================================
                   작성자 소개
              ================================================== -->

              <label class="field field--wide">
                <span>작성자 소개</span>

                <textarea
                  id="post-author-bio"
                  rows="4"
                  placeholder="기사 마지막에 표시될 작성자 소개를 입력하세요."
                ></textarea>
              </label>

              <label class="checkbox-field">
                <input
                  type="checkbox"
                  id="post-published"
                  checked
                />

                <span>사이트에 공개</span>
              </label>
            </div>

            <!-- =================================================
                 본문
            ================================================== -->

            <section class="body-editor-section">
              <div class="body-editor-label">
                본문
              </div>

              <div
                class="editor-toolbar"
                id="editor-toolbar"
                role="toolbar"
                aria-label="본문 서식"
              >
                <button
                  type="button"
                  data-command="bold"
                  title="굵게"
                >
                  <strong>B</strong>
                </button>

                <button
                  type="button"
                  data-command="italic"
                  title="기울임"
                >
                  <em>I</em>
                </button>

                <button
                  type="button"
                  data-command="underline"
                  title="밑줄"
                >
                  <u>U</u>
                </button>

                <button
                  type="button"
                  data-command="strikeThrough"
                  title="취소선"
                >
                  <s>S</s>
                </button>

                <button
                  type="button"
                  data-block="p"
                >
                  P
                </button>

                <button
                  type="button"
                  data-block="h2"
                >
                  H2
                </button>

                <button
                  type="button"
                  data-block="blockquote"
                >
                  “ ”
                </button>

                <button
                  type="button"
                  data-command="insertUnorderedList"
                >
                  • LIST
                </button>

                <button
                  type="button"
                  data-command="insertOrderedList"
                >
                  1. LIST
                </button>

                <button
                  type="button"
                  data-command="justifyLeft"
                >
                  LEFT
                </button>

                <button
                  type="button"
                  data-command="justifyCenter"
                >
                  CENTER
                </button>

                <button
                  type="button"
                  data-command="justifyRight"
                >
                  RIGHT
                </button>

                <button
                  type="button"
                  id="link-button"
                >
                  LINK
                </button>

                <!-- 글자 크기 -->

                <button
                  type="button"
                  id="small-text-button"
                  title="선택한 글자 작게"
                >
                  SMALL
                </button>

                <!-- 참고문헌 -->

                <button
                  type="button"
                  id="footnote-button"
                  title="현재 커서 위치에 참고문헌 삽입"
                >
                  각주 ■
                </button>

                <!-- 글자색 -->

                <div
                  class="text-color-tool"
                  aria-label="글자색"
                >
                  <span class="text-color-label">
                    글자색
                  </span>

                  <button
                    type="button"
                    class="text-color-button text-color-button--black"
                    data-text-color="#111111"
                    title="검정"
                  ></button>

                  <button
                    type="button"
                    class="text-color-button text-color-button--gray"
                    data-text-color="#888888"
                    title="회색"
                  ></button>

                  <button
                    type="button"
                    class="text-color-button text-color-button--red"
                    data-text-color="#e12727"
                    title="빨강"
                  ></button>

                  <button
                    type="button"
                    class="text-color-button text-color-button--blue"
                    data-text-color="#2457d6"
                    title="파랑"
                  ></button>

                  <button
                    type="button"
                    class="text-color-button text-color-button--green"
                    data-text-color="#16834b"
                    title="초록"
                  ></button>
                </div>

                <button
                  type="button"
                  data-command="undo"
                >
                  UNDO
                </button>

                <button
                  type="button"
                  data-command="redo"
                >
                  REDO
                </button>
              </div>

              <div
                class="body-editor"
                id="body-editor"
                contenteditable="true"
                role="textbox"
                aria-multiline="true"
                data-placeholder="본문을 입력하세요."
              ></div>
            </section>

            <!-- =================================================
                 참고문헌 편집창
            ================================================== -->

            <section
              class="footnote-editor-panel"
              id="footnote-editor-panel"
              hidden
            >
              <div class="footnote-editor-heading">
                <strong>참고문헌</strong>

                <button
                  type="button"
                  id="footnote-editor-close"
                  aria-label="닫기"
                >
                  ×
                </button>
              </div>

              <textarea
                id="footnote-editor-text"
                rows="5"
                placeholder="참고문헌 내용을 입력하세요."
              ></textarea>

              <div class="footnote-editor-actions">
                <button
                  type="button"
                  id="footnote-editor-delete"
                >
                  각주 삭제
                </button>

                <button
                  type="button"
                  id="footnote-editor-save"
                >
                  적용
                </button>
              </div>
            </section>

            <p
              class="form-message"
              id="save-message"
              aria-live="polite"
            ></p>
          </form>
        </section>
      </div>
    </main>

    <script
      src="./admin.js?v=3"
      defer
    ></script>
  </body>
</html>
