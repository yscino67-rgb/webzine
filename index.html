<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#ffffff"
    />

    <title>Magazine</title>

    <link
      rel="stylesheet"
      href="./css/style.css?v=10"
    />

    <link
      rel="stylesheet"
      href="./css/intro.css"
    />
  </head>

  <body class="intro-body">
    <header class="site-header">

      <a
  class="site-logo"
  href="./index.html"
  aria-label="횡단 홈으로 이동"
>
  <img
    src="./logo.svg"
    alt=""
  />

  <span class="site-logo-name">
    횡단
  </span>
</a>

      <button
        class="menu-button"
        type="button"
        aria-label="메뉴 열기"
        aria-expanded="false"
        aria-controls="site-menu"
      >
        <img
          src="./bar.svg"
          alt=""
        />
      </button>

      <nav
      class="site-menu"
      id="site-menu"
      aria-label="주요 메뉴"
    >
     <a href="./html/archive.html?category=criticism">
       CRITICISM
    </a>

     <a href="./html/archive.html?category=article">
       ARTICLE
    </a>

     <a href="./html/archive.html?category=interview">
       INTERVIEW
    </a>

    <a href="./html/archive.html?category=essay">
      ESSAY
    </a>

    <a href="./html/about.html">
      ABOUT
    </a>
    </nav>
    </header>

    <main class="intro-page">
      <section
        class="morph-stage"
        aria-label="3D 입자 애니메이션"
      >
        <div class="morph-scene"></div>

        <nav
  class="galaxy-categories"
  aria-label="카테고리"
>
  <a
    class="galaxy-category"
    href="./html/archive.html?category=criticism"
    data-category-label
    data-angle="2.65"
    data-radius="0.94"
  >
    <span>CRITICISM</span>
  </a>

  <a
    class="galaxy-category"
    href="./html/archive.html?category=essay"
    data-category-label
    data-angle="3.85"
    data-radius="0.76"
  >
    <span>ESSAY</span>
  </a>

  <a
    class="galaxy-category"
    href="./html/archive.html?category=interview"
    data-category-label
    data-angle="1.35"
    data-radius="0.72"
  >
    <span>INTERVIEW</span>
  </a>

  <a
    class="galaxy-category"
    href="./html/archive.html?category=article"
    data-category-label
    data-angle="5.45"
    data-radius="0.82"
  >
    <span>ARTICLE</span>
  </a>

  <a
    class="galaxy-category"
    href="./html/about.html"
    data-category-label
    data-angle="0.65"
    data-radius="1.02"
  >
    <span>ABOUT</span>
  </a>
</nav>
      </section>
    </main>

    <script
      type="module"
      src="./intro.js"
    ></script>

    <script
      src="./script.js"
      defer
    ></script>
  </body>
</html>
