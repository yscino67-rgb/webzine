<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta name="theme-color" content="#ffffff" />

    <title>Magazine</title>

    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/intro.css" />
  </head>

  <body class="intro-body">
    <header class="site-header">
      <a class="site-logo" href="./index.html" aria-label="홈으로 이동">
        <span>MAGAZINE</span>
      </a>

      <button
        class="menu-button"
        type="button"
        aria-label="메뉴 열기"
        aria-expanded="false"
        aria-controls="site-menu"
      >
        <img src="./bar.svg" alt="" />
      </button>

      <nav class="site-menu" id="site-menu" aria-label="주요 메뉴">
        <a href="./html/criticism.html">CRITICISM</a>
        <a href="./html/article.html">ARTICLE</a>
        <a href="./html/interview.html">INTERVIEW</a>
        <a href="./html/essay.html">ESSAY</a>
        <a href="./html/about.html">ABOUT</a>
      </nav>
    </header>

    <main class="intro-page">
      <section
        class="morph-stage"
        aria-label="3D 입자 애니메이션"
      >
        <div class="morph-scene"></div>

        <nav
          class="galaxy-categories"
          aria-label="카테고리"
        >
          <a
            class="galaxy-category category-essay"
            href="./html/archive.html?category=essay"
            data-category-label
          >
            <span>ESSAY</span>
          </a>

          <a
            class="galaxy-category category-article"
            href="./html/archive.html?category=article"
            data-category-label
          >
            <span>ARTICLE</span>
          </a>

          <a
            class="galaxy-category category-criticism"
            href="./html/archive.html?category=criticism"
            data-category-label
          >
            <span>CRITICISM</span>
          </a>

          <a
            class="galaxy-category category-interview"
            href="./html/archive.html?category=interview"
            data-category-label
          >
            <span>INTERVIEW</span>
          </a>

          <a
            class="galaxy-category category-about"
            href="./html/about.html"
            data-category-label
          >
            <span>ABOUT</span>
          </a>
        </nav>
      </section>
    </main>

    <script type="module" src="./intro.js"></script>
    <script src="./script.js" defer></script>
  </body>
</html>
