<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#ffffff"
    />

    <title>Magazine Archive</title>

    <link
      rel="stylesheet"
      href="../css/style.css?v=17"
    />

    <link
      rel="stylesheet"
      href="../css/index.css?v=17"
    />
  </head>

  <body class="archive-page">
    <header class="site-header archive-header">
      <nav
        class="archive-filter"
        aria-label="카테고리 메뉴"
      >
        <a
          class="archive-filter-all"
          href="./archive.html?category=all"
        >
          ALL
        </a>

        <div
          class="archive-filter-items"
          id="archive-filter-items"
        >
          <a href="./archive.html?category=criticism">
            CRITICISM
          </a>

          <a href="./archive.html?category=interview">
            INTERVIEW
          </a>

          <a href="./archive.html?category=essay">
            ESSAY
          </a>

          <a href="./archive.html?category=article">
            ARTICLE
          </a>

          <a href="./about.html">
            ABOUT
          </a>
        </div>

        <button
          class="archive-filter-toggle"
          type="button"
          aria-label="카테고리 메뉴 열기"
          aria-expanded="false"
          aria-controls="archive-filter-items"
        >
          <span aria-hidden="true"></span>
        </button>
      </nav>
    </header>

    <main class="site-main">
      <!-- 정렬 버튼 -->
      <section
        class="archive-sort"
        aria-label="기사 정렬"
      >
        <button
          class="archive-sort-button"
          id="archive-sort-button"
          type="button"
          aria-label="현재 정렬: 최신순. 눌러서 다음 정렬 방식으로 변경"
        >
          최신순
        </button>
      </section>

      <!-- 기사 목록 -->
      <section
        class="article-index"
        id="article-index"
        aria-label="기사 목록"
        aria-live="polite"
      >
        <p class="archive-loading">
          기사를 불러오는 중입니다.
        </p>
      </section>
    </main>

    <script
      src="../script.js?v=17"
      defer
    ></script>

    <script
      src="../archive.js?v=2"
      defer
    ></script>
  </body>
</html>
