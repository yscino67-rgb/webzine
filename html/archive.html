<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#ffffff"
    />

    <title>Magazine Archive</title>

    <!-- 공통 스타일 -->
    <link
      rel="stylesheet"
      href="../css/style.css?v=18"
    />

    <!-- 인덱스 전용 스타일 -->
    <link
      rel="stylesheet"
      href="../css/index.css?v=18"
    />
  </head>

  <body class="archive-page">

    <!-- =====================================================
         횡단
    ====================================================== -->

    <div class="page-brand">
      횡단
    </div>


    <!-- =====================================================
         상단 카테고리 메뉴
    ====================================================== -->

    <header class="site-header archive-header">
      <nav
        class="archive-filter"
        aria-label="카테고리 메뉴"
      >
        <!-- ALL -->

        <a
          class="archive-filter-all"
          href="./archive.html?category=all"
        >
          ALL
        </a>


        <!-- 펼쳐지는 메뉴 -->

        <div
          class="archive-filter-items"
          id="archive-filter-items"
        >
          <a
            href="./archive.html?category=criticism"
          >
            CRITICISM
          </a>

          <a
            href="./archive.html?category=interview"
          >
            INTERVIEW
          </a>

          <a
            href="./archive.html?category=essay"
          >
            ESSAY
          </a>

          <a
            href="./archive.html?category=article"
          >
            ARTICLE
          </a>

          <a
            href="./about.html"
          >
            ABOUT
          </a>
        </div>


        <!-- 검정 네모 메뉴 버튼 -->

        <button
          class="archive-filter-toggle"
          type="button"
          aria-label="카테고리 메뉴 열기"
          aria-expanded="false"
          aria-controls="archive-filter-items"
        >
          <span aria-hidden="true"></span>
        </button>
      </nav>
    </header>


    <!-- =====================================================
         기사 인덱스
    ====================================================== -->

    <main class="site-main">

      <!-- ===================================================
           검정 정렬바

           왼쪽:
           흰색 네모 2개

           오른쪽:
           LATEST → OLDEST → CRITICISM...
      ==================================================== -->

      <div
        class="archive-sort"
        aria-label="기사 정렬 및 필터"
      >

        <!-- 왼쪽 흰색 블록 -->

        <div
          class="archive-sort-blocks"
          aria-hidden="true"
        >
          <span></span>
          <span></span>
        </div>


        <!-- 오른쪽 순환 정렬 버튼 -->

        <button
          class="archive-sort-button"
          id="archive-sort-button"
          type="button"
          data-mode="newest"
          aria-label="현재 정렬: LATEST. 눌러서 다음 정렬 방식으로 변경"
        >
          LATEST
        </button>
      </div>


      <!-- ===================================================
           기사 목록
      ==================================================== -->

      <section
        class="article-index"
        id="article-index"
        aria-label="기사 목록"
        aria-live="polite"
      >
        <p class="archive-loading">
          기사를 불러오는 중입니다.
        </p>
      </section>
    </main>


    <!-- =====================================================
         공통 스크립트
    ====================================================== -->

    <script
      src="../script.js?v=18"
      defer
    ></script>


    <!-- =====================================================
         아카이브 기사 목록 / 정렬
    ====================================================== -->

    <script
      src="../archive.js?v=3"
      defer
    ></script>
  </body>
</html>
