<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <meta
      name="theme-color"
      content="#ffffff"
    />

    <title>Magazine Article</title>

    <!-- 공통 스타일 -->
    <link
      rel="stylesheet"
      href="../css/style.css?v=25"
    />

    <!-- INDEX 상단 메뉴 스타일 재사용 -->
    <link
      rel="stylesheet"
      href="../css/index.css?v=25"
    />

    <!-- 기사 상세 스타일 -->
    <link
      rel="stylesheet"
      href="../css/article.css?v=15"
    />
  </head>

  <body class="article-detail-page">

    <!-- =====================================================
         횡단
         INDEX와 완전히 동일한 구조
    ====================================================== -->

    <div class="page-brand">
      횡단
    </div>


    <!-- =====================================================
         상단 카테고리 메뉴
         INDEX와 동일
    ====================================================== -->

    <header
      class="site-header archive-header article-archive-header"
    >
      <nav
        class="archive-filter is-open"
        aria-label="카테고리 메뉴"
        data-default-open="true"
      >
        <!-- ALL -->

        <a
          class="archive-filter-all"
          href="./archive.html?category=all"
        >
          ALL
        </a>


        <!-- 펼쳐진 메뉴 -->

        <div
          class="archive-filter-items"
          id="archive-filter-items"
        >
          <a
            href="./archive.html?category=criticism"
          >
            CRITICISM
          </a>

          <a
            href="./archive.html?category=interview"
          >
            INTERVIEW
          </a>

          <a
            href="./archive.html?category=essay"
          >
            ESSAY
          </a>

          <a
            href="./archive.html?category=article"
          >
            ARTICLE
          </a>

          <a
            href="./about.html"
          >
            ABOUT
          </a>
        </div>


        <!-- 검정 네모 -->

        <button
          class="archive-filter-toggle"
          type="button"
          aria-label="카테고리 메뉴 닫기"
          aria-expanded="true"
          aria-controls="archive-filter-items"
        >
          <span aria-hidden="true"></span>
        </button>
      </nav>
    </header>


    <!-- =====================================================
         기사
    ====================================================== -->

    <main class="article-page">
      <article
        class="article-detail"
        id="article-detail"
        aria-live="polite"
      >
        <p class="article-loading">
          기사를 불러오는 중입니다.
        </p>
      </article>
    </main>


    <!-- =====================================================
         공통 상단 메뉴 스크립트
    ====================================================== -->

    <script
      src="../script.js?v=25"
      defer
    ></script>


    <!-- =====================================================
         기사 데이터 로드
    ====================================================== -->

    <script
      src="../article.js?v=3"
      defer
    ></script>
  </body>
</html>
